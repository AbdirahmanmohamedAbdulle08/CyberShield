<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 90" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Shield Emblem -->
  <g transform="translate(10, 8)">
    <!-- Outer Shield Frame -->
    <path d="M38 5 L68 16 C68 46 54 64 38 72 C22 64 8 46 8 16 Z" fill="url(#shieldGrad)" stroke="#00e5ff" stroke-width="2.5" filter="url(#glow)"/>
    <!-- Inner Dark Core -->
    <path d="M38 12 L62 21 C62 45 50 59 38 65 C26 59 14 45 14 21 Z" fill="#080d1a" stroke="#0284c7" stroke-width="1.2"/>
    <!-- Circuit Lines / Core Node -->
    <circle cx="38" cy="38" r="6" fill="#00e5ff" filter="url(#glow)"/>
    <circle cx="38" cy="38" r="2.5" fill="#ffffff"/>
    <path d="M38 21 L38 32 M38 44 L38 56 M23 38 L32 38 M44 38 L53 38" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <circle cx="38" cy="21" r="2" fill="#38bdf8"/>
    <circle cx="38" cy="56" r="2" fill="#38bdf8"/>
    <circle cx="23" cy="38" r="2" fill="#38bdf8"/>
    <circle cx="53" cy="38" r="2" fill="#38bdf8"/>
  </g>
  <!-- Brand Typography -->
  <text x="96" y="44" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif" font-weight="800" font-size="30" letter-spacing="1" fill="#ffffff">
    CYBER<tspan fill="url(#cyanGlow)">SHIELD</tspan>
  </text>
  <!-- Tagline -->
  <text x="98" y="64" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif" font-weight="600" font-size="11" letter-spacing="2.8" fill="#64748b">
    DETECT · EDUCATE · DEFEND
  </text>
</svg>
